name: Deploy to Cloudflare (hook fallback)

# This is a backup for Cloudflare Workers Builds not responding to GitHub pushes.
# It does NOT contain the deploy hook URL; store that only in GitHub Actions secrets.
on:
  workflow_run:
    workflows: ["Validate static site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: at-towfiq-cloudflare-production
  cancel-in-progress: false

jobs:
  trigger-cloudflare:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check hook secret
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Cloudflare deploy hook not yet configured. Add CLOUDFLARE_DEPLOY_HOOK_URL in repository Actions secrets. Nothing deployed."
            exit 0
          fi

      - name: Trigger production build from current main
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Deployment skipped: hook not configured."
            exit 0
          fi
          case "$DEPLOY_HOOK" in
            https://api.cloudflare.com/client/v4/workers/builds/deploy_hooks/*) ;;
            *) echo "::error::CLOUDFLARE_DEPLOY_HOOK_URL must be a Cloudflare Workers Builds deploy hook URL."; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 40 \
            --request POST "$DEPLOY_HOOK"
          echo "Requested a fresh Cloudflare Workers build of the configured production branch."
